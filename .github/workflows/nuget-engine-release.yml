name: NuGet Engine Release

# Publishes KillerScan.Engine to nuget.org when a KillerScan release is published, at the
# app's version. nuget.org Trusted Publishing issues a short-lived key for this workflow, so no
# API key is stored in the repository. Run it by hand to publish an existing release; a
# metadata-repair commit may change package metadata, but the engine code must match the tag.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Published app version, for example 1.8.0'
        required: true
      source_ref:
        description: 'Optional metadata-repair commit; engine code must match the release tag'
        required: false

concurrency:
  group: nuget-engine-release
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      (github.event_name == 'release' && !github.event.release.prerelease) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    # Windows, so the net48 build and its regression run sit beside net10.0.
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: pwsh
    env:
      REQUESTED_VERSION: ${{ inputs.version }}
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      SOURCE_REF: ${{ inputs.source_ref }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select and verify release source
        id: release
        run: |
          $version = $env:REQUESTED_VERSION
          if ($env:RELEASE_TAG) { $version = $env:RELEASE_TAG -replace '^v', '' }
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Expected a stable x.y.z version.' }
          $tag = "v$version"
          $release = gh release view $tag --json isDraft,isPrerelease | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $release.isDraft -or $release.isPrerelease) { throw 'A published stable app release is required.' }
          $source = $tag
          if ($env:SOURCE_REF) {
            $source = $env:SOURCE_REF
            if ($source -notmatch '^[a-fA-F0-9]{40}$') { throw 'Metadata repair requires a full commit SHA.' }
            git merge-base --is-ancestor $source origin/main
            if ($LASTEXITCODE -ne 0) { throw 'Repair commit must be on main.' }
            git diff --exit-code $tag $source -- Engine Resources/oui.txt ':!Engine/KillerScan.Engine.csproj' ':!Engine/README.md' ':!Engine/icon.png'
            if ($LASTEXITCODE -ne 0) { throw 'Engine code differs from the released source.' }
          }
          git checkout --detach $source
          if ($LASTEXITCODE -ne 0) { throw 'Release source checkout failed.' }
          # The engine takes its version from KillerScan.csproj, so the app version is the
          # package version.
          [xml]$app = Get-Content 'KillerScan.csproj'
          if ($app.SelectSingleNode('/Project/PropertyGroup/Version').InnerText -ne $version) {
            throw 'App and release versions must match.'
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore tests/KillerScan.Engine.Tests/KillerScan.Engine.Tests.csproj

      - name: Test
        run: |
          dotnet build tests/KillerScan.Engine.Tests/KillerScan.Engine.Tests.csproj -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($tfm in 'net48', 'net10.0') {
            dotnet run --project tests/KillerScan.Engine.Tests/KillerScan.Engine.Tests.csproj -c Release -f $tfm --no-build
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Pack
        run: dotnet pack Engine/KillerScan.Engine.csproj -c Release -o artifacts/nuget

      - name: Preserve packages
        uses: actions/upload-artifact@v4
        with:
          name: engine-${{ steps.release.outputs.version }}
          path: artifacts/nuget/*
          if-no-files-found: error

      - name: Sign in to NuGet
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: StevetheKiller

      - name: Publish package and symbols
        env:
          ENGINE_VERSION: ${{ steps.release.outputs.version }}
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push "artifacts/nuget/KillerScan.Engine.$env:ENGINE_VERSION.nupkg" --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet nuget push "artifacts/nuget/KillerScan.Engine.$env:ENGINE_VERSION.snupkg" --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate
          exit $LASTEXITCODE
