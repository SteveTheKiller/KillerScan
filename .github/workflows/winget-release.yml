# Submits KillerScan to winget-pkgs when a GitHub release is published.
#
# This is the SINGLE winget submission path - release.ps1 deliberately does not call komac.
# Doing it in both places double-submits (KillerPDF hit that on 2026-08-04).
#
# Needs the WINGET_TOKEN secret: a CLASSIC personal access token with the public_repo scope.
# Fine-grained tokens can commit but cannot open the pull request to winget-pkgs. Without the
# secret this fails in about 7 seconds with "GitHub token is invalid" - which is silent unless
# you look at the Actions tab, so check a release actually produced a PR.
#
# `komac update` only works once the package already exists in winget-pkgs; the very first
# submission has to be `komac new` by hand.
#
# A release-triggered run starts seconds after release.ps1 finished creating the release and
# uploading its assets, and GitHub throttles the branch push komac needs on the way out. It
# surfaces as "Ref cannot be created" or "SteveTheKiller does not have the correct permissions
# to execute CreateRef", which reads like a bad token and is not: the same secret succeeds on a
# later retry. That cost four releases across four repos before it was identified on 2026-08-26.
# The submit step now settles first and retries with backoff.
#
# workflow_dispatch is still the manual retry path: re-running this with the tag is the fix for
# anything the backoff does not outlast, and it needs no re-release.

name: WinGet Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.1.7)'
        required: true

# Nothing here writes to this repository; komac uses WINGET_TOKEN for the winget-pkgs fork.
permissions:
  contents: read

jobs:
  submit:
    # A prerelease is not submitted to WinGet. The manual retry path still runs.
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    runs-on: windows-latest
    steps:
      # The WinGet description comes from the Chocolatey nuspec at the released tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || github.event.inputs.tag }}
          persist-credentials: false

      # Prints what WINGET_TOKEN actually is, so a failure downstream is never guesswork again.
      # An empty x-oauth-scopes means a FINE-GRAINED token, which authenticates fine, reads fine,
      # and cannot create the branch komac needs. That failure is reported as
      # "does not have the correct permissions to execute CreateRef", which reads like something
      # else entirely. A classic token prints its scopes and must include public_repo.
      - name: Check WinGet token
        run: |
          $headers = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
            "User-Agent" = "KillerScan-WinGet-Release"
          }
          try {
              $r = Invoke-WebRequest -Uri "https://api.github.com/user" -Headers $headers -UseBasicParsing
              $login = ($r.Content | ConvertFrom-Json).login
              $scopes = $r.Headers['x-oauth-scopes']
              $expiry = $r.Headers['github-authentication-token-expiration']
              Write-Host "login:   $login"
              Write-Host "scopes:  $scopes"
              Write-Host "expires: $expiry"
              if (-not $scopes) {
                  Write-Host "WARNING: no scopes reported. This is a fine-grained token and it CANNOT push a branch to the winget-pkgs fork. Replace it with a classic PAT carrying public_repo."
              }
              elseif ($scopes -notmatch 'public_repo|(^|,\s*)repo(,|$)') {
                  Write-Host "WARNING: classic token without public_repo or repo. It cannot push a branch to the winget-pkgs fork."
              }
          } catch {
              Write-Host "WARNING: /user returned $($_.Exception.Response.StatusCode.value__). The token is invalid or expired."
          }

          # Can this token actually write to the fork? This is the exact permission komac needs.
          try {
              $f = Invoke-RestMethod -Uri "https://api.github.com/repos/SteveTheKiller/winget-pkgs" -Headers $headers
              Write-Host "fork push permission: $($f.permissions.push)"
          } catch {
              Write-Host "WARNING: cannot read the winget-pkgs fork with this token."
          }
        env:
          GITHUB_TOKEN: ${{ secrets.WINGET_TOKEN }}
        shell: pwsh

      - name: Install Komac
        run: |
          # Pinned. Komac 2.17 (2026-10-14) stopped writing manifests for --dry-run --output,
          # which failed every release after it. Move the pin only after a release succeeds with it.
          $tag = 'v2.16.0'
          $ver = $tag.TrimStart('v')
          # The hash is GitHub's published digest for that asset. Komac runs with WINGET_TOKEN in
          # reach, so a different binary under the same tag must never start. Move it with the tag.
          $sha256 = 'BDC45BAF028F750DA7519CC8A5F2EAB5DFEF46DFE88650EEB0D0A9BF51446E4F'
          $url = "https://github.com/russellbanks/Komac/releases/download/$tag/komac-$ver-x86_64-pc-windows-msvc.exe"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\komac.exe"
          $actual = (Get-FileHash "$env:RUNNER_TEMP\komac.exe" -Algorithm SHA256).Hash
          if ($actual -ne $sha256) { Remove-Item "$env:RUNNER_TEMP\komac.exe"; throw "komac $tag hash $actual does not match the pinned $sha256." }
          Add-Content $env:GITHUB_PATH $env:RUNNER_TEMP
        shell: pwsh

      - name: Submit to WinGet
        run: |
          $releaseTag = if ($env:EVENT_NAME -eq 'workflow_dispatch') { $env:INPUT_TAG } else { $env:RELEASE_TAG }
          if ($releaseTag -notmatch '^v\d+\.\d+\.\d+$') { Write-Error "Release tag '$releaseTag' is not vMAJOR.MINOR.PATCH."; exit 1 }
          $version = $releaseTag.TrimStart('v')
          $base = "https://github.com/SteveTheKiller/KillerScan/releases/download/$releaseTag"
          $url = "$base/KillerScan.exe"

          # Let the release settle before asking GitHub for a branch. See the header note.
          if ($env:EVENT_NAME -eq 'release') { Start-Sleep -Seconds 90 }

          # komac hashes whatever it downloads, so check first that the release asset is the one
          # release.ps1 built: the published checksum and a valid signature from the release certificate.
          $exe = Join-Path $env:RUNNER_TEMP 'KillerScan.exe'
          Invoke-WebRequest -Uri $url -OutFile $exe
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash
          $sums = (Invoke-WebRequest -Uri "$base/SHA256SUMS.txt" -UseBasicParsing).Content
          if ($sums -is [byte[]]) { $sums = [Text.Encoding]::UTF8.GetString($sums) }
          $listed = [regex]::Match($sums, '(?m)^KillerScan\.exe\s+([0-9A-Fa-f]{64})\s*$').Groups[1].Value
          if ($listed -ne $hash) { Write-Error "KillerScan.exe does not match SHA256SUMS.txt (listed '$listed', downloaded $hash)."; exit 1 }
          $signature = Get-AuthenticodeSignature $exe
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.GetNameInfo([Security.Cryptography.X509Certificates.X509NameType]::SimpleName, $false) -ne 'Open Source Developer Stephen Riley') {
              Write-Error "KillerScan.exe is not validly signed by the release certificate ($($signature.Status))."; exit 1
          }

          # Write the manifests locally first so the installer manifest can be corrected before
          # it is submitted.
          $out = Join-Path $env:RUNNER_TEMP 'winget-manifests'
          if (Test-Path $out) { Remove-Item $out -Recurse -Force }
          komac update SteveTheKiller.KillerScan --version $version --urls $url --dry-run --output $out
          if ($LASTEXITCODE -ne 0) { Write-Error "komac update failed with exit $LASTEXITCODE"; exit 1 }
          $dir = Join-Path $out "manifests/s/SteveTheKiller/KillerScan/$version"
          $installer = Join-Path $dir 'SteveTheKiller.KillerScan.installer.yaml'
          if (-not (Test-Path $installer)) { Write-Error "komac did not write $installer"; exit 1 }
          $text = Get-Content $installer -Raw
          # komac downloads the installer again on its own; the hash it wrote must be the copy
          # checked above, or an asset swapped in between would be submitted unchecked.
          $listedSha = [regex]::Match($text, '(?m)^\s*InstallerSha256:\s*(\S+)').Groups[1].Value
          if ($listedSha -ne $hash) { Write-Error "komac's installer hash $listedSha is not the verified $hash."; exit 1 }

          # KillerScan installs itself machine-wide with /silent and registers its own uninstall
          # entry, so it is submitted as an exe installer. komac copies the
          # previous manifest's portable type, so the first exe submission rewrites it here.
          # Later runs find exe already in place and leave the manifest as komac wrote it.
          if ($text -match '(?m)^InstallerType:\s*portable\s*$') {
              $sha = [regex]::Match($text, '(?m)^\s*InstallerSha256:\s*(\S+)').Groups[1].Value
              $date = [regex]::Match($text, '(?m)^ReleaseDate:\s*(\S+)').Groups[1].Value
              $manifestVersion = [regex]::Match($text, '(?m)^ManifestVersion:\s*(\S+)').Groups[1].Value
              if (-not $sha -or -not $manifestVersion) { Write-Error "komac's installer manifest is missing its hash or manifest version"; exit 1 }
              $lines = @(
                  "# yaml-language-server: `$schema=https://aka.ms/winget-manifest.installer.$manifestVersion.schema.json"
                  ''
                  'PackageIdentifier: SteveTheKiller.KillerScan'
                  "PackageVersion: $version"
                  'InstallerType: exe'
                  'Scope: machine'
                  'InstallModes:'
                  '- silent'
                  '- silentWithProgress'
                  'InstallerSwitches:'
                  '  Silent: /silent'
                  '  SilentWithProgress: /silent'
                  'UpgradeBehavior: install'
              )
              if ($date) { $lines += "ReleaseDate: $date" }
              $lines += @(
                  'AppsAndFeaturesEntries:'
                  '- DisplayName: KillerScan'
                  '  Publisher: Steve the Killer'
                  "  DisplayVersion: $version"
                  '  ProductCode: KillerScan'
                  'Installers:'
                  '- Architecture: x64'
                  "  InstallerUrl: $url"
                  "  InstallerSha256: $sha"
                  'ManifestType: installer'
                  "ManifestVersion: $manifestVersion"
              )
              $text = ($lines -join "`n") + "`n"
          }

          # komac cannot read the version an exe installer registers, so it copies DisplayVersion
          # from the previous manifest, and winget validation rejects the PR. Set it to this
          # release's version before submitting.
          $text = $text -replace '(?m)^([ \t]*DisplayVersion:[ \t]*)[^\r\n]*', "`${1}$version"
          Set-Content $installer $text -NoNewline -Encoding utf8
          Select-String -Path $installer -Pattern 'InstallerType|DisplayVersion'

          # komac also copies the previous locale manifest, which carried a Description cut off
          # mid-word and the old website. Fill both description fields with the nuspec's one-line
          # summary. The full feature list sent 1.8.2 and 1.8.3 to manual policy review
          # (Policy-Test-2.7); the short text is what passed automatically before.
          [xml]$spec = Get-Content (Join-Path $env:GITHUB_WORKSPACE 'choco\killerscan.nuspec') -Raw
          $meta = $spec.package.metadata
          $summary = $meta.summary.Trim()
          if ($summary.Length -gt 256) { Write-Error "The nuspec summary is longer than WinGet's 256-character ShortDescription"; exit 1 }
          $locale = Join-Path $dir 'SteveTheKiller.KillerScan.locale.en-US.yaml'
          if (-not (Test-Path $locale)) { Write-Error "komac did not write $locale"; exit 1 }
          $loc = (Get-Content $locale -Raw) -replace '\r\n', "`n"
          $loc = [regex]::Replace($loc, '(?m)^PackageUrl:[^\n]*', { param($m) 'PackageUrl: ' + $meta.projectUrl.Trim() })
          $loc = [regex]::Replace($loc, '(?m)^ShortDescription:[^\n]*', { param($m) "ShortDescription: '" + $summary.Replace("'", "''") + "'" })
          $loc = [regex]::Replace($loc, '(?m)^Description:[^\n]*\n(?:(?:[ \t]+[^\n]*)?\n)*?(?=[A-Za-z])', { param($m) "Description: '" + $summary.Replace("'", "''") + "'`n" })
          Set-Content $locale $loc -NoNewline -Encoding utf8
          Select-String -Path $locale -Pattern '^(PackageUrl|ShortDescription|Description):'

          # komac picks a fresh GUID for its branch name every run, so a retry never collides
          # with a half-finished attempt.
          $delays = @(60, 150, 300)
          for ($i = 0; $i -le $delays.Count; $i++) {
              komac submit $dir --yes
              if ($LASTEXITCODE -eq 0) { exit 0 }
              if ($i -eq $delays.Count) { break }
              Write-Host "Submit failed with exit $LASTEXITCODE. Retrying in $($delays[$i])s."
              Start-Sleep -Seconds $delays[$i]
          }
          Write-Error "komac submit failed after $($delays.Count + 1) attempts"
          exit 1
        env:
          GITHUB_TOKEN: ${{ secrets.WINGET_TOKEN }}
          # Event values reach the script as data, never as script text.
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: pwsh
