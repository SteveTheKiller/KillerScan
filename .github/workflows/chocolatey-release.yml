name: Chocolatey Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true

# Nothing here writes to the repository; the token is read-only and not left in the checkout.
permissions:
  contents: read

jobs:
  push:
    # A prerelease is not published to Chocolatey. The manual retry path still runs.
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    runs-on: windows-latest
    steps:
      # The released tag's nuspec and install script, also for a manual retry of an older tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || github.event.inputs.tag }}
          persist-credentials: false

      - name: Build and push Chocolatey package
        shell: pwsh
        env:
          CHOCO_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
          # Event values reach the script as data, never as script text.
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          $releaseTag = if ($env:EVENT_NAME -eq 'workflow_dispatch') { $env:INPUT_TAG } else { $env:RELEASE_TAG }
          if ($releaseTag -notmatch '^v\d+\.\d+\.\d+$') { throw "Release tag '$releaseTag' is not vMAJOR.MINOR.PATCH." }
          $version = $releaseTag.TrimStart('v')
          $base    = "https://github.com/SteveTheKiller/KillerScan/releases/download/$releaseTag"
          $exeUrl  = "$base/KillerScan.exe"

          # Download release EXE and compute hash
          Write-Host "Downloading $exeUrl..."
          Invoke-WebRequest -Uri $exeUrl -OutFile "$env:RUNNER_TEMP\KillerScan.exe"
          $hash = (Get-FileHash "$env:RUNNER_TEMP\KillerScan.exe" -Algorithm SHA256).Hash
          Write-Host "SHA256: $hash"

          # The package pins whatever was downloaded, so check it is the release release.ps1 built:
          # the published checksum and a valid signature from the release certificate.
          $sums = (Invoke-WebRequest -Uri "$base/SHA256SUMS.txt" -UseBasicParsing).Content
          $listed = [regex]::Match($sums, '(?m)^KillerScan\.exe\s+([0-9A-Fa-f]{64})\s*$').Groups[1].Value
          if ($listed -ne $hash) { throw "KillerScan.exe does not match SHA256SUMS.txt (listed '$listed', downloaded $hash)." }
          $signature = Get-AuthenticodeSignature "$env:RUNNER_TEMP\KillerScan.exe"
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.GetNameInfo([Security.Cryptography.X509Certificates.X509NameType]::SimpleName, $false) -ne 'Open Source Developer Stephen Riley') {
              throw "KillerScan.exe is not validly signed by the release certificate ($($signature.Status), $($signature.SignerCertificate.Subject))."
          }

          # Stamp version and hash into package files
          $nuspec  = "choco\killerscan.nuspec"
          $install = "choco\tools\chocolateyInstall.ps1"

          (Get-Content $nuspec)  -replace 'REPLACE_VERSION', $version | Set-Content $nuspec
          (Get-Content $install) -replace 'REPLACE_HASH',    $hash    | Set-Content $install

          # Chocolatey moderation rejects links it cannot use, so check them before submitting.
          # A 403 or 429 from this runner is not a broken link: Cloudflare in front of our own sites
          # and jsDelivr refuse many GitHub runner addresses while the same page loads for people and
          # for moderators. Only a missing page, an unreachable host or a raw.githubusercontent.com
          # link stops the push.
          [xml]$spec = Get-Content $nuspec -Raw
          $meta = $spec.package.metadata
          $problems = @()
          foreach ($field in 'packageSourceUrl','projectUrl','iconUrl','licenseUrl','projectSourceUrl','docsUrl','bugTrackerUrl','releaseNotes') {
              $url = [string]$meta.$field
              if ($url -notmatch '^https?://') { continue }
              if (([uri]$url).Host -eq 'raw.githubusercontent.com') { $problems += "$field uses raw.githubusercontent.com, which Chocolatey does not accept: $url"; continue }
              try { $null = Invoke-WebRequest -Uri $url -UseBasicParsing -TimeoutSec 60 }
              catch {
                  $status = 0
                  if ($_.Exception.Response) { $status = [int]$_.Exception.Response.StatusCode }
                  if ($status -eq 403 -or $status -eq 429) {
                      Write-Host "::warning::$field answered $status to this runner, which is bot protection refusing GitHub's addresses, not a missing page: $url"
                      continue
                  }
                  $problems += "$field did not load: $url ($($_.Exception.Message))"
              }
          }
          if ($problems) { $problems | ForEach-Object { Write-Host "::error::$_" }; throw "The nuspec has links Chocolatey moderation will reject." }

          # Pack and push
          choco pack choco\killerscan.nuspec --out "$env:RUNNER_TEMP"
          if ($LASTEXITCODE -ne 0) { throw "choco pack failed." }
          $package = "$env:RUNNER_TEMP\killerscan.$version.nupkg"
          choco push $package --source https://push.chocolatey.org --api-key $env:CHOCO_API_KEY
          if ($LASTEXITCODE -ne 0) {
              # Chocolatey answers most rejections with a bare 403, so report what the package page shows.
              $page = "https://community.chocolatey.org/packages/killerscan"
              try {
                  $html = (Invoke-WebRequest $page -UseBasicParsing -TimeoutSec 60).Content
                  foreach ($row in [regex]::Matches($html, '<td class="version"\s*>[\s\S]*?<span>([^<]+)</span>[\s\S]*?</tr>')) {
                      $held = $row.Groups[1].Value.Trim()
                      $badge = [regex]::Match($row.Value, 'class="badge[^"]*">([^<]+)<').Groups[1].Value.Trim()
                      if ($badge -and $badge -notmatch 'Approved|Exempted') { Write-Host "::error::Version $held is in moderation: $badge. See $page/$held" }
                  }
              } catch { Write-Host "Could not read $page : $($_.Exception.Message)" }
              throw "choco push was rejected. An earlier version in moderation with none approved blocks new pushes. Other causes are an API key that does not own the package or a version that already exists."
          }
          "CHOCO_VERSION=$version" >> $env:GITHUB_ENV
          "CHOCO_PACKAGE=$package" >> $env:GITHUB_ENV

      # A successful push is not an accepted package. Chocolatey validates it later, and its
      # validator sometimes fails with "We were unable to find a package" while its own service
      # is degraded; its instruction is to upload the package again. Watch the result, re-push
      # once on a failure, and fail this job if validation still fails so it never goes unnoticed.
      # The package page is cached and can show Pending for hours after validation passes, so the
      # result is read from the package feed instead.
      - name: Wait for Chocolatey validation
        shell: pwsh
        timeout-minutes: 170
        env:
          CHOCO_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
        run: |
          $page = "https://community.chocolatey.org/packages/killerscan/$env:CHOCO_VERSION"
          $feed = "https://community.chocolatey.org/api/v2/Packages(Id='killerscan',Version='$env:CHOCO_VERSION')"
          $repushed = $false
          $pendingSinceRepush = $false
          $lastKnownState = ''
          $deadline = (Get-Date).AddMinutes(160)
          while ((Get-Date) -lt $deadline) {
              Start-Sleep -Seconds 300
              try {
                  $entry = (Invoke-WebRequest $feed -UseBasicParsing -TimeoutSec 90).Content
              } catch {
                  Write-Host "Package feed unavailable: $($_.Exception.Message). Retrying."
                  continue
              }
              $state = [regex]::Match($entry, '<d:PackageValidationResultStatus>(\w+)</d:PackageValidationResultStatus>').Groups[1].Value
              if ($state) { $lastKnownState = $state }
              Write-Host "$(Get-Date -Format HH:mm:ss) validation: $(if ($state) { $state } else { 'not shown' })"
              if ($state -like 'Pass*') { exit 0 }
              if ($repushed -and $state -and $state -notlike 'Fail*') { $pendingSinceRepush = $true }
              if ($state -notlike 'Fail*') { continue }
              if (-not $repushed) {
                  Write-Host "Validation failed. Pushing the same package again as Chocolatey instructs."
                  choco push $env:CHOCO_PACKAGE --source https://push.chocolatey.org --api-key $env:CHOCO_API_KEY
                  if ($LASTEXITCODE -ne 0) { throw "Re-push to Chocolatey failed." }
                  $repushed = $true
              } elseif ($pendingSinceRepush) {
                  throw "Chocolatey validation failed twice. See $page"
              }
          }
          if ($lastKnownState -like 'Fail*') {
              throw "Chocolatey validation remained failed after re-push. See $page"
          }
          # Chocolatey's queue often takes longer than this. The package is already pushed, so a
          # validation that is still pending is a warning, not a failed release.
          Write-Host "::warning::Chocolatey validation was still pending after 160 minutes. The package was pushed. See $page"
          exit 0
